name: Test and build portable apps
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS-arm64
          - os: macos-15-intel
            platform: macOS-x64
          - os: windows-2022
            platform: Windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: FPS-Tools-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/smoke-report.json
          if-no-files-found: error
